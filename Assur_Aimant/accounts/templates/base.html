<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>AssurAimant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="bg-white shadow p-4 flex justify-between">
  <span class="font-bold">AssurAimant</span>

  <div>
    {% if user.is_authenticated %}
      <a href="{% url 'logout' %}" class="text-red-600">Déconnexion</a>
    {% else %}
      <a href="{% url 'login' %}" class="mr-4">Connexion</a>
      <a href="{% url 'signup' %}">Inscription</a>
    {% endif %}
  </div>
</nav>

<div class="container mx-auto">
  {% if messages %}
    {% for message in messages %}
      <div class="mt-4 p-2 bg-green-100 text-green-700">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
</div>

{% block content %}{% endblock %}

</body>
</html>
